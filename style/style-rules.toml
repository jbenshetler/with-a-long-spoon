# style-rules.toml — prose style tics to flag for "With a Long Spoon".
#
# Recall-first: these FLAG, they do not fix. Many rules (especially the
# structural regex ones) are deliberately high-recall and WILL catch legitimate
# prose — that is the point. You read the density and decide. Tune freely.
#
#   kind = "phrase"  → literal text, matched on word boundaries, case-insensitive
#                      (set case_sensitive = true to force exact case).
#   kind = "regex"   → raw PCRE (the `regex` module). Use TOML '' literal strings
#                      so backslashes need no escaping. Case-sensitive by default;
#                      set case_insensitive = true, or prefix the pattern with (?i).
#
# Fields: id, kind, phrase|pattern, severity (error|warn|info), why,
#         optional suggest, optional unless (suppress a hit if this pattern also
#         matches the hit's line), optional scope (scenes|meta), optional case flags.

# ---- Filtered / weak constructions -----------------------------------------

[[rule]]
id       = "the-way"
kind     = "phrase"
phrase   = "the way"
severity = "warn"
why      = "Filtered construction ('the way he…'); usually telling. Cut or recast into the direct image."

[[rule]]
id       = "filter-verbs"
kind     = "regex"
pattern  = '(?i)\b(?:she|he|they|i)\s+(?:could\s+)?(?:felt|saw|noticed|watched|realized|realised|sensed|heard)\b'
severity = "warn"
why      = "Filter verb distances the reader from sensation. 'Body before mind' — render the thing, not the perceiving of it."

[[rule]]
id       = "began-to"
kind     = "regex"
pattern  = '(?i)\b(?:began|started)\s+to\b'
severity = "info"
why      = "Throat-clearing aspect. 'She began to walk' → 'She walked.'"

[[rule]]
id       = "there-was-were"
kind     = "regex"
pattern  = '(?i)\bthere\s+(?:was|were)\b'
severity = "info"
why      = "Existential 'there was…' often buries the real subject. Consider recasting."

# ---- Structural tics --------------------------------------------------------

[[rule]]
id       = "flat-interrogative"
kind     = "regex"
pattern  = '(?i)"(?:what|how|why|who|where|when|which|are|is|do|does|did|can|could|will|would|should|you okay)\b[^"?.!]*,"'
severity = "warn"
why      = "Interrogative dialogue punctuated flat (comma, no question mark) — a borrowed literary mannerism. Author ruling 2026-07-31: genuine questions, especially comfort/safety check-ins, get real question marks; flat delivery reads as telling her she's okay rather than asking, and renders Pace cold. Flat is permitted only where the narration explicitly marks the line as not really a question."


[[rule]]
id       = "x-not-y"
kind     = "regex"
pattern  = '\b\w+,\s+not\s+\w+'
severity = "info"
why      = "Antithesis 'X, not Y' — fine once, a tic in bulk. Watch the density across the scene."

[[rule]]
id       = "not-x-but-y"
kind     = "regex"
pattern  = '(?i)\bnot\s+(?:\w+[\s,]+){1,6}but\b'
severity = "info"
why      = "'Not X but Y' antithesis (X may be several words) — same construction as x-not-y. Vary or cut if it clusters."
unless   = '(?i)\bnot\s+only\b'   # 'not only … but also' is a correlative, not the tic

[[rule]]
id       = "empty-balance"
kind     = "regex"
pattern  = '''(?i)(?:\bnot|n['’]t)\s+(?:\w+\s+){0,2}?ma[dk]e[sn]?\s+(?:\w+\s+){0,3}?less\b'''
severity = "info"
why      = "Concessive balanced-negation ('X did not make it less Y') — often a FALSE antithesis: the terms don't actually exclude, so the sentence borrows the music of paradox with none of its content. Check X and Y genuinely oppose; delete-test the negated half — if only cadence is lost, cut it."

# ---- Lexical / word-choice tics ---------------------------------------------

[[rule]]
id       = "weather"
kind     = "phrase"
phrase   = "weather"
severity = "warn"
why      = "'weather' as metaphor (sensation/mood as 'weather') is a tic. Allowed ONLY for literal meteorology — recast any figurative use."

[[rule]]
id       = "a-small"
kind     = "regex"
pattern  = '(?i)\ba\s+small\s+\w+'
severity = "warn"
why      = "'a small X' is the tic — substantially reduce. Cut, or choose a more specific image."

[[rule]]
id       = "file-verb"
kind     = "regex"
pattern  = '(?i)(?<!\b(?:a|an|the|this|that|these|those|her|his|my|your|our|their|its|each|every|one|paper|case|nail|single|whole|personnel|on)\s)\b(?:re-?)?fil(?:e|es|ed|ing)\b'
severity = "warn"
why      = "'file' as a verb (categorizing/re-filing experience as paperwork) is a tic. Recast the categorization image; noun uses are fine."

[[rule]]
id       = "catalog-verb"
kind     = "regex"
pattern  = '(?i)(?<!\b(?:a|an|the|this|that|these|those|her|his|my|your|our|their|its)\s)\bcatalog(?:ue)?(?:s|ed|ing|d)?\b'
severity = "warn"
why      = "'catalog' as a verb (cataloging/itemizing experience) is a tic. Recast; noun uses are fine."

[[rule]]
id       = "register-verb"
kind     = "regex"
# Detect the VERB positively rather than excluding noun phrases. The old
# negative lookbehind inspected only one word, so "the register" was excluded
# but "the warm low register" was not — 14 of 28 book-wide hits were nouns.
# Widening the lookbehind is worse (it suppresses real verbs whenever any
# determiner falls within a few words). Safe because the book is past tense:
# -ed/-ing are always verbal, and bare "registers" occurs only as a noun.
pattern  = '(?i)\bregister(?:ed|ing)\b|\bto\s+register\b|\b(?:not|never|hardly|barely|would|could|might|must|may|can|will|even)\s+register\b|\b(?:watch(?:ed|es|ing)?|saw|see|seen|heard|hear|felt|feel|let|made|make)\s+\w+\s+register\b'
severity = "warn"
why      = "'register' as a verb (noticing-and-storing experience as a record) is the retired filing/cataloging frame — renders Pace/Randi as cold collectors. Recast into the embodied image; noun uses (a register, her register, cash/vocal register) are fine."

[[rule]]
id       = "clock-verb"
kind     = "regex"
# Same inversion as register-verb above (see that comment). The old pattern
# missed "no clock", "a kind of clock" — 4 of 10 hits were nouns.
pattern  = '(?i)\bclock(?:ed|ing)\b|\bto\s+clock\b|\b(?:not|never|hardly|barely|would|could|might|must|may|can|will|even)\s+clock\b|\b(?:watch(?:ed|es|ing)?|saw|see|seen|heard|hear|felt|feel|let|made|make)\s+\w+\s+clock\b'
severity = "warn"
why      = "'clock' as a verb (noticing-and-storing, 'she clocked it') is the retired filing/cataloging frame — renders Pace/Randi as cold collectors. Recast into the embodied image; noun uses (the clock, o'clock, clockwise) are fine."

[[rule]]
id       = "learn"
kind     = "regex"
pattern  = '(?i)\blearn(?:s|ed|ing)?\b'
severity = "info"
why      = "Not a tic — a default-reach word the assistant favors. On each hit, double-check it's the precise verb and not autopilot; often it isn't."

[[rule]]
id       = "without-asking"
kind     = "phrase"
phrase   = "without asking"
severity = "warn"
why      = "'without asking' telegraphs the consent theme. Render the act; let the absence of asking land without the label."

[[rule]]
id       = "out-ahead"
kind     = "phrase"
phrase   = "out ahead"
severity = "warn"
why      = "'out ahead (of her)' — the body-before-mind tic (want/need arriving before thought). The idea is right; the phrasing is overused. Vary the image."
suggest  = "her body arrived before her mind / before she'd decided / faster than thought / her want got there first / her body outran her."

[[rule]]
id       = "in-her-chest"
kind     = "phrase"
phrase   = "in her chest"
severity = "info"
why      = "'… in her chest' — emotional response located in the chest (something shifted/tightened/moved in her chest) is a recurring locus tic, 13 occurrences across scenes. Vary the somatic image or cut."

[[rule]]
id       = "whole-of"
kind     = "phrase"
phrase   = "whole of"
severity = "warn"
why      = "'the whole of her / the whole of it' — the totality/absorption tic, overused. Cut to 'all of', or recast to a concrete image. Keep only rarely, with the author's direction."

[[rule]]
id       = "cost-vague"
kind     = "regex"
pattern  = '(?i)\bcost(?:s|ing)?\s+(?:(?:him|her|them|me|us|you|it)\s+)?(?:nothing|anything|something)\b'
severity = "info"
scope    = "scenes"
why      = "The figurative 'cost her nothing / cost him something / cost anything' construction — cost-as-measure-of-feeling with the price named but LEFT VAGUE. Author ruling 2026-08-11 (School Nights line edit): it's specifically the vagueness of 'something / nothing / anything' that snags — the construction names a price and then refuses to say what, and the reader can't tell which price is meant. NARROWED to that family on the author's call: the QUANTIFIED figurative costs ('cost more', 'cost less', 'cost everything', 'cost dearly', bare 'cost him') are NOT flagged — they name a magnitude and read clean. The MEANING is thesis-load-bearing (cost = the measurement of love; meta-condensed-dear.md, satc-tracks.md:123) — the CANONICAL protected instance is dear.md:97 ('it had cost something … spent it on her without appearing to count it'), where the vagueness IS the beat (Vee can't name the cost because it's the measure of Randi choosing her out loud) and stays where it earns it — this rule polices the vague WORDING, not the theme: read the density, keep the load-bearing, vary or cut the reflex ones. Note Randi's effortless-power 'cost her nothing' (sorority:49 the-costs-her-something-to-give real laugh, all-the-time), the-bench:517's the-face dissociation ('given away all day and cost nothing'), and fed:13's antithesis ('everything that had cost her into a story that had cost her nothing') are DESIGNED — protect the move, vary only if it clusters. COUNTEREXAMPLE (author ruling 2026-08-11): peekaboo:19's 'looked like it had cost him nothing' was NOT protected — even framed as appearance ('looked like'), saying a high-effort thing cost nothing snags; recast to 'looked like no trouble at all' (rides the sentence's own trouble/trouble/trouble figure). The 'looked like' framing does not license the vague idiom. Scoped to scenes; the meta/ docs discuss the motif legitimately."

[[rule]]
id       = "unhurried"
kind     = "phrase"
phrase   = "unhurried"
severity = "warn"
why      = "'unhurried' — the slow/in-control tic, badly overused (80+ times across scenes, a 14-hit cluster in vee-on-the-bench). Author ruling 2026-07-28: unhurried is PACE'S word in this novel — on anyone else it's a register leak, cut or recast. On Pace, still thin drastically; save it for the rare load-bearing beat. Vary the image — don't just swap in another reach-word."
suggest  = "slow / took his time / in no rush / patient / without hurry / let it take its time (pick per beat; vary, don't substitute one tic for another)"

[[rule]]
id       = "warm"
kind     = "regex"
pattern  = '(?i)\bwarm(?:th|er|est|ly|ing|ed)?\b'
severity = "info"
scope    = "scenes"
why      = "'warm / warmth' — the default-reach warmth word, heavily overused (~500 across scenes). Thematic, so much is load-bearing (Vee's analog warmth, the porch as the warm room, Randi's warmth-under-gloss). Worked a scene at a time: read the paragraph density, keep the load-bearing, vary or cut the reflex ones — then --ack the sanctioned uses so the scene goes quiet."

[[rule]]
id       = "vivienne"
kind     = "phrase"
phrase   = "Vivienne"
severity = "warn"
scope    = "scenes"
why      = "The name-toggle: 'Vivienne' (vs 'Vee') carries weight and must stay RARE and deliberate — used only with the author's direction (he says it once deliberately; she signs something formal; her mother is angry). Flag EVERY use for author sign-off; --ack the sanctioned ones."

# ---- Recognition / appreciation beat tics -----------------------------------

[[rule]]
id       = "there-she-is"
kind     = "regex"
pattern  = '(?i)\bthere\s+(?:she|he|you|they)\s+(?:is|are)\b'
severity = "warn"
why      = "'There she is' / 'there you are' — the tender-recognition reveal beat, badly overused. Recast or cut."

[[rule]]
id       = "look-at-her"
kind     = "regex"
pattern  = '(?i)\blook\s+at\s+(?:her|him|you|them)\b'
severity = "warn"
why      = "'Look at her' / 'look at you' — the appreciation beat, badly overused. Recast or cut."

[[rule]]
id       = "undone"
kind     = "regex"
pattern  = '(?i)\b(?:undone|undid)\b'
severity = "warn"
why      = "'undone/undid' for sexual excitement or orgasm is a tic. Fine for literal unfastening (clothes, laces, a belt) — those are auto-suppressed. When it means arousal or climax, recast."
suggest  = "climax: came apart / broke / went over / came / unraveled / gave way / shattered. excitement: unstrung / wrecked / went weak / came loose / lost the shape of herself."
unless   = '(?i)\b(?:belt|button|buttons|buckle|buckled|clasp|clasps|lace|laces|laced|zip|zipper|zipped|knot|cuff|cuffs|hook|hooks|snap|snaps|sash|corset|bodice|apron|strap|straps|robe|shirt|blouse|dress|bra|collar|fly|button-?up)\b'

[[rule]]
id       = "sternum"
kind     = "regex"
pattern  = '(?i)\bsternum\b'
severity = "error"
scope    = "scenes"
why      = "AUTHOR RULING (2026-08-06): 'sternum' is banned outright — no one says 'sternum'; if we aren't using adverbs to mimic common speech we're definitely not using sternum. Feelings live in the chest, heart, throat, stomach, gut, behind the eyes, a clenched jaw, a burning face, tingling hands; for literal anatomy use breastbone or chest. No exceptions, no --ack."

[[rule]]
id       = "no-record-player"
kind     = "regex"
pattern  = '(?i)\b(?:record player|phonograph|gramophone|wax cylinder|piano roll|cassette|8-track)s?\b|\bneedle (?:dropped|drop|on the record)\b'
severity = "error"
scope    = "scenes"
why      = "AUTHOR RULING (2026-08-06): anachronism — there is no record player in Pace's house; he controls music from his phone (playlists; stereo/speakers are only the output — see the {{In Her Place}} music note). Period music hardware reads like wax cylinders on a college campus. Render room-music phone-driven and unremarked. ('turntable'/'vinyl' deliberately not matched: the diner's display turntable and vinyl siding/seats are legitimate.)"

[[rule]]
id       = "fluorescent-site"
kind     = "regex"
pattern  = '(?i)\bfluorescent\w*\b'
severity = "info"
scope    = "scenes"
why      = '''AUTHOR RULING (2026-08-12): not a ban — a site check. Fluorescent tubes are an anachronism in the NEW/renovated buildings of a modern, well-funded university; a current-day campus interior reads LED. They remain correct in older or cheaper sites. Ruled at the All the Time line edit: `practice-room:121` changed ("thin fluorescent light" -> "the hard white light") because it is a modern campus building; `practice-room:135` KEPT (the bad fluorescent hum — the hum is the sentence's sound detail and LEDs do not hum); `rock:127` KEPT (high-school gymnasium, ~5 years earlier — period-correct, and the badness of the light is the point); `under-the-rug:43` KEPT (a cheap bright restaurant, not a campus building; the harshness works against the dark-booth chapters).

WHEN THIS FIRES: do not auto-change it. Identify the SITE, decide whether that site would plausibly still have tubes, and DISCUSS with the author. House style for modern interiors is to render the light's QUALITY, never the fixture — cf. all-the-time:139 "blue academic lighting" and practice-room:121 "the hard white light", both anachronism-proof.'''

# ---- Hard canon rules (never name, never explain) ---------------------------

[[rule]]
id       = "never-name"
kind     = "regex"
pattern  = '(?i)\b(?:autis\w*|asperger\w*|neurodiverg\w*|on the spectrum|diagnos\w*)\b'
severity = "error"
scope    = "scenes"
why      = "CRAFT RULE: never label Pace's temperament (his introversion and hyperfocus) on the page — it lives only in behavior, never as a diagnosis. Remove."

[[rule]]
id       = "held-past"
kind     = "regex"
pattern  = '''(?i)\b(?:(?:a|one|two|half\s+a|a\s+half|a\s+few|several)\s+(?:half-)?(?:beat|second|moment|breath|heartbeat)s?)\s+(?:too\s+\w+|past)\b|\b(?:(?:a|one|two|half\s+a|a\s+half|a\s+few|several)\s+(?:half-)?(?:beat|second|moment|breath|heartbeat)s?)\s+(?:longer|more)\b(?=[^.!?;]{0,40}\bthan\b)|\b(?:longer|more)\s+than\s+(?:the|a|an|it|any|his|her|their|she|he)\s+[\w\x27\- ]{2,25}\s*(?:needed|need|required|asked|called\s+for|warranted|took|had\s+to|meant\s+to|allowed)\b|\bpast\s+what\s+[\w\x27\- ]{2,25}\s*(?:needed|required|would|called\s+for)\b'''
severity = "warn"
why      = '''The held-past-the-function figure (a beat longer than the work required / a beat past what a goodbye needed / a half-second longer than the errand needed). A distinctive authorial tic, NOT ordinary syntax — re-harvested by MOVE rather than by phrase on 2026-08-08 and found 16 times across 12 Volume One chapters, twice the density the string-match harvest reported (echo ledger #59/#60). Clusters are the real problem: three inside thirty lines in a-round, two in all-the-time. Also breaches meta-plan-satc-tracks.md:105 (render each rung in fresh language; never reuse the same description across scenes) when it renders Randi goodbye kisses in the same construction twice. Randi pausing over a cup or a drink is DESIGNED characterization — protect the move, vary the wording. Rule the shape, never the count.

NARROWED 2026-08-09 (author ruling, The Induction line-edit review). The rule no longer fires on the BARE comparative — "a moment longer" / "a moment more" with no function clause after it. Those are idiom, not the figure: ordinary English for a character pausing before acting, with no named function and nothing for a reader's ear to catch. Evidence: five instances of "[X] looked ... a moment longer" across Volume One (long-way:11, may-i-choose:59, the-induction:37, we-find-out:73, outlier:87 — two of them in consecutive chapters), and SIX cold readers reading the full chapter chain flagged none of them, while the same readers did catch real repetition in those chapters. The distinctive tic is the MEASURED COMPARISON — a duration named against the function it exceeds ("longer than the errand needed", "a beat past what a goodbye needed"). "longer/more" now requires a "than" within 40 characters; the "too ___" and "past ___" forms are unchanged and still fire. This narrowing dropped 8 of 36 book-wide hits, all bare. Ledger: echo-rulings #63.'''
