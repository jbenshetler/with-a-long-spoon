# Cold-reader model pricing — USD per 1,000,000 tokens.
# Read by tools/cold_read.py via stdlib tomllib (Python >= 3.11).
#
# Reasoning tokens are billed AS output tokens, so there is no separate
# "reasoning" rate — put the reasoning price into `output`.
#
# The per-scene --budget-usd is converted into a hard max_output_tokens cap
# using the `output` rate, so a single call cannot exceed the budget. A model
# with no entry here (and no --price-in/--price-out override) is REFUSED rather
# than run uncapped.

[models."gpt-5.5"]
input = 5.00
output = 30.00   # reasoning included

[models."gpt-5.6-sol"]
input = 5.00
output = 30.00   # reasoning included
# Context limits, author-verified 2026-09-19. Recorded because the fact-audit
# lane builds WHOLE-VOLUME prompts (Vol 1 alone is ~182k tokens) and must fail
# closed before a call rather than discover a ceiling mid-request. Note the
# usable input ceiling is well below the context window — output and reasoning
# come out of the same budget.
context_window = 1050000
max_input = 922000
max_output = 128000

# Rates are the DIRECT OpenAI API's. An OpenRouter route for this model was
# priced (2026-08-06) at $1 in / $6 out and rejected: cold reads emit a full
# retentive carry-forward every chapter, so the corpus runs ~1.3-1.7:1
# input:output — below the 2:1 break-even where the cheaper input would pay
# for the dearer output. Direct is also Responses-API native; OpenRouter is
# Chat Completions only and would need a port.
[models."gpt-5.6-terra"]
input = 2.00
output = 4.00    # reasoning included

# OpenRouter rates WITH the ensemble-config [openrouter] floor applied
# (quantizations = ["fp8", "bf16"]; require_parameters = true), read per endpoint
# from https://openrouter.ai/api/v1/models/<id>/endpoints on 2026-10-01. The
# model-level list price is the cheapest endpoint, usually fp4, which the floor
# excludes. The table records the DEAREST allowed endpoint so the dollar guard
# stays conservative; the comment gives the cheapest allowed, which is what the
# router normally picks. Re-read before any large paid run; endpoints move.

# kimi-k3: allowed = Morph fp8 $2.18/$9.81 (cheapest), DeepInfra bf16 $2.85/$14.25.
[models."moonshotai/kimi-k3"]
input = 2.85
output = 14.25

# glm-5.3: allowed fp8 = Morph $0.06/$2.69 (cheapest), Baidu $0.16/$0.49,
# Sail $0.20/$3.40, SiliconFlow $0.70/$2.20.
[models."z-ai/glm-5.3"]
input = 0.70
output = 3.40

# gemini-3.8-flash: the floor is DISABLED for this reader (first-party only,
# quantization unpublished). Google prices by prompt-size tier: $0.38/$1.88,
# $0.75/$3.75, $1.35/$6.75. Our gates and cold reads sit in the lower tiers;
# whole-volume and mint prompts can reach the top one.
[models."google/gemini-3.8-flash"]
input = 1.35
output = 6.75

# deepseek-v4-pro-0813: allowed fp8 = Baidu $0.18/$0.55 (cheapest), Novita
# $0.99/$2.97, NextBit/GMICloud $1.06/$3.17.
[models."deepseek/deepseek-v4-pro-0813"]
input = 1.06
output = 3.17
