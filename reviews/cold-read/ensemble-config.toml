version = 1

# ===========================================================================
# THE SINGLE AUTHORITATIVE ROSTER for both blind instruments (author ruling
# 2026-09-26). `[panel]` is the grounded cold-read panel; `[capture]` is the
# capture-DAG roster. CLAUDE.md and the skill docs POINT here and must not
# restate model lists — they drifted (the docs said glm-5.3-flash while this
# file said glm-5.3, and a session ran the wrong model on their word). Print
# the live rosters with `tools/cold_read_config.py`. Tools read these lists;
# `capture_dag.py` refuses a model that is not in `[capture]` (retired ones
# need --allow-retired).
#
# Lane is derived from the id: `claude-*` = headless Claude subscription OAuth;
# `gpt-*` = codex subscription (gpt-6-sol needs CODEX_BIN, see its reader
# block); anything with a `provider_model` = OpenRouter, paid, authorized per
# run.
# ===========================================================================
[panel]
models = [
  "claude-fable-5",
  "claude-opus-4-8",
  "claude-opus-5",
  "gpt-5.6-sol",
  "gpt-5.5",
  "kimi-k3",
  "glm-5.3",
  "deepseek-v4-pro-0813",
]
fast = ["claude-opus-4-8", "gpt-5.6-sol"]
# Retired from the cold panel. Reads on disk were erased 2026-09-26 (git history
# keeps them); qwen cannot be routed under the quantization floor (its single
# Alibaba endpoint reports `unknown`) and the floor stands.
retired = ["claude-sonnet-5", "gpt-5.6-terra", "qwen3.8-max-0902", "glm-5.3-flash"]

[capture]
models = [
  "claude-opus-4-8",
  "claude-opus-5",
  "gpt-5.6-sol",
  "gpt-5.5",
  "gpt-6-sol",
  "glm-5.3",
  "gemini-3.8-flash",
  # Promoted from a one-round trial (author ruling 2026-09-26): reads like the
  # romance-graduate the persona was written for, and it is cheap on the
  # subscription lane.
  "claude-fable-5-1",
]
# Off the capture roster. `claude-fable-5` keeps its gates on disk as history
# (author ruling 2026-09-26) but is not extended without being named; every
# other retired model's gates were erased the same day. gpt-6-astra was a
# one-day trial replaced by gpt-6-sol.
retired = [
  "claude-fable-5",
  "deepseek-v4-pro-0813",
  "qwen3.8-max-0902",
  "kimi-k3",
  "glm-5.3-flash",
  "gpt-6-astra",
  # Trialled one round 2026-09-26; not different enough from the other Opus
  # lanes to keep (author ruling). Its gates were erased with the ruling.
  "claude-opus-5-5",
]

# ---------------------------------------------------------------------------
# OpenRouter provider routing + per-use policy.
#
# `[openrouter]` is the routing floor applied to EVERY OpenRouter call, from
# every tool. OpenRouter free-routes across ~20-33 endpoints per model at
# mixed numeric precision; the low-precision ones return malformed artifacts.
# On 2026-09-17 a Volume 1 remint lost 4 of 10 paid mints this way — Parasail
# served kimi-k3 at fp4 (11k reasoning tokens, none of the 8 required
# headings) while serving glm-5.3 at fp8 without trouble, so the fault is the
# quantization, not the provider. `require_parameters` additionally drops
# endpoints that accept `reasoning_effort` and ignore it (Wafer returned
# reasoningTokens=1 on an effort=high call).
#
# `[openrouter.policy.<tag>]` blocks carry per-use call parameters and inherit
# the routing floor. Callers pass a tag, never raw numbers, so the values stay
# declared in one place instead of drifting across tools.
[openrouter]
quantizations = ["fp8", "bf16"]
require_parameters = true

[openrouter.policy.mint]          # checkpoint_extract — 10-50 chapters per call
effort = "high"
timeout = 2400
max_output_tokens = 80000

[openrouter.policy.read]          # cold_read_grounded — one chapter per call
effort = "low"
timeout = 2400
max_output_tokens = 18000

[openrouter.policy.judge]         # cold_read_judge
effort = "low"
timeout = 2400
max_output_tokens = 18000

[openrouter.policy.audit]         # authorship_audit
effort = "low"
timeout = 2400
max_output_tokens = 8000

[openrouter.policy.fact]          # fact_audit — whole-volume ledger, large structured output
effort = "high"
timeout = 2400
max_output_tokens = 32000

[openrouter.policy.capture]       # capture_dag / capture_panel
# Raised 16000 -> 20000 (author ruling 2026-09-24). `max_output_tokens` is
# shared between reasoning and visible output, so a reader that thinks hard
# about a heavy chapter can spend the whole budget before finishing its gate.
# Observed on gemini-3.8-flash: three rejected gates in one 75-chapter run
# (hills-and-valleys, we-find-out, believe-me — a fight, a rupture, and the
# "words are cheap" confrontation), each truncated mid-sentence at 28-298
# chars. Each retry succeeded, so the old cap simply billed the same chapter
# twice. Rejected responses now land in `<lane>/.failed/` for exactly this
# diagnosis.
effort = "low"
timeout = 900
max_output_tokens = 20000

[readers."gemini-3.8-flash"]
vendor = "google"
provider_model = "google/gemini-3.8-flash"
# Quantization filter disabled for this reader. The `[openrouter]` floor guards
# against third-party resellers serving an OPEN-WEIGHT model at reduced
# precision; Gemini is first-party only — all six of its endpoints are Google
# or Google AI Studio, and every one reports `quantization: unknown` because
# Google does not publish it. Applying the floor leaves zero endpoints and
# fails every call. Do NOT fix this by adding "unknown" to the global list:
# that readmits the third-party endpoints the floor exists to exclude.
quantizations = []

[readers."qwen3.8-max-0902"]
vendor = "alibaba"
provider_model = "qwen/qwen3.8-max-0902"
checkpoint_source = "ensemble:core"
can_mint_checkpoint = false
review_effort = "low"
review_max_output_tokens = 18000

[readers."deepseek-v4-pro-0813"]
vendor = "deepseek"
provider_model = "deepseek/deepseek-v4-pro-0813"
checkpoint_source = "ensemble:core"
can_mint_checkpoint = false
review_effort = "low"
review_max_output_tokens = 18000

[ensembles.core]
matcher_model = "gpt-5.6-terra"
quorum = 2
cross_vendor = true
minimum_claims = 24
required_sections = [
  "Who's who",
  "Relationships",
  "What I know that they don't",
  "Motifs & images",
  "Symbolism",
  "Open questions",
  "Story so far",
  "Impression",
]
entity_exception = "source-verified"
impression = "quorum"

[[ensembles.core.sources]]
model_id = "claude-fable-5"
vendor = "anthropic"

[[ensembles.core.sources]]
model_id = "claude-opus-4-8"
vendor = "anthropic"

[[ensembles.core.sources]]
model_id = "gpt-5.5"
vendor = "openai"

[[ensembles.core.sources]]
model_id = "gpt-5.6-sol"
vendor = "openai"

[readers."kimi-k3"]
vendor = "moonshot"
provider_model = "moonshotai/kimi-k3"

[readers."glm-5.3"]
vendor = "zhipu"
provider_model = "z-ai/glm-5.3"

[readers."gpt-6-sol"]
vendor = "openai"
# Codex subscription lane. The openai-codex SDK's bundled codex binary (0.147.0)
# rejects this id on a ChatGPT account; the installed CLI (>= 0.157.1) accepts
# it. Run with CODEX_BIN=/path/to/codex (see tools/cold_read.py).
