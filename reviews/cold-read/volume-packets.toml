[volumes."1"]
opening_slug = "the-bench"
packet = '''On the cover: the series line **WITH A LONG SPOON · BOOK ONE**, the volume title **A POLITE INVITATION**, and the author **Helen Rivers**. (No tagline on the front — it is the blurb page's closing beat.)

The jacket / blurb page:

> Randi and Pace are lovers, and they have planned the best year of Vivienne Thorne's life. She doesn't know there's a plan.
>
> Everyone calls her Vee. She is twenty-one and quietly starving. The men have been fine. The friendships have been fine. Fine has never once been enough. So when her glamorous new friend Randi steers her, laughing, as if by accident, toward Pace, a young mathematician, Vee goes to him because everything in her has been waiting to.
>
> Pace sees her completely. Courtly and exact, he asks before he takes, until choosing becomes the most erotic thing she has ever done. Over long lunches Vee tells Randi everything. Randi listens, and draws her further open, and Vee never lets herself notice how much she wants Randi too.
>
> What Vee can't see is that she was chosen in a game Randi and Pace started in bed. She is the first woman Randi has ever let herself want. What none of them sees coming is how real it will get for each of them.
>
> Every yes was freely given. That was the problem.
>
> *Book One of* With a Long Spoon. *Literary erotica: contemporary, explicit, and psychologically exact.*'''

# Volume 2 (fall-2, "A Warm Reception") — full jacket, accepted 2026-10-20 (the
# copy under "## Volume 2 blurb" in meta/meta-blurb.md). Replaced the title-only
# card it carried since the 2026-10-09 split.
[volumes."2"]
opening_slug = "lesson"
packet = '''On the cover: the series line **WITH A LONG SPOON · BOOK TWO**, the volume title **A WARM RECEPTION**, and the author **Helen Rivers**. (No tagline on the front — it is the blurb page's closing beat.)

The jacket / blurb page:

> He gives her everything but a word for what they are.
>
> Vivienne "Vee" Thorne has found the best thing in her life, and it has no name. Pace, a young mathematician, courtly and exact, sees her as no one ever has. In his house in the woods, the body she has always hidden becomes the thing he treasures, and every step further is hers. When she asks what she is to him out in the world, he tells her to believe what he does, and says nothing more.
>
> Every Saturday she brings all of it to Randi: the new hungers, what her body does now, what she can't make sense of alone, and the silence where his word should be. Across a brunch table where nothing is too intimate to tell, Randi wants every detail, slowly, and hands Vee's greed back to her as a gift: *you're just finally hungry out loud.* The goodbye kisses last a little longer each time. Vee calls it friendship.
>
> What Vee cannot see is that Randi and Pace are lovers, that they chose her together, and that everything she confides travels farther than she knows. What none of them counted on is how real it has become for all three, and what it has begun to cost.
>
> Warmer and more explicit than the book before it, *A Warm Reception* lets the reader, a step ahead of Vee from the first page, feel every degree of the heat come up.
>
> They welcomed her warmly. A warm reception is also what you call walking into fire.
>
> *Book Two of* With a Long Spoon. *Literary erotica: contemporary, explicit, and psychologically exact.*'''

# Volume 3 (spring, "A Proper Serving") — the jacket below is the copy written for
# this volume's CONTENT while it was numbered Book Two and titled A Warm Reception.
# Only the derived facts were changed on 2026-10-09 (book number, volume title); the
# copy itself is untouched and WANTS AN AUTHOR PASS — it was tuned to the word "warm".
[volumes."3"]
opening_slug = "missed-a-spot"
packet = '''On the cover: the series line **WITH A LONG SPOON · BOOK THREE**, the volume title **A PROPER SERVING**, and the author **Helen Rivers**. (No tagline on the front — it is the blurb page's closing beat.)

The jacket / blurb page:

> Two people set the table for Vivienne "Vee" Thorne's spring. She believes she pulled out the chair herself.
>
> She is twenty-one, a college junior, and she came to them already starving — starving since girlhood, long before either of them — and this spring she learns her appetite runs in more directions than one. Its steady center is Pace, a mathematician, courtly and exact, whose unhurried attention has made a home of the hours behind his door. Under it she crosses thresholds the Vee of last autumn would never have dared, one after another, each on her own nerve, until the daring itself becomes the thing she craves — and she is glad of it, every time she reaches for more.
>
> The long lunches are dinners now, and Randi is across the table for every one. She listens as no one ever has, leaning close, drawing the next thing and the next out of Vee until she is laughing more than she meant to and coloring at what she cannot explain. What surfaced without a name last fall has one this spring, and she can no longer keep from knowing it: she wants the woman across the table as surely as she wants the man behind the door. That reaching is hers, too.
>
> What Vee cannot see is that Randi and Pace chose her together, once, before she was anything to either of them. What none of them counted on was how far it would carry them: she has moved the two who arranged her spring as surely as they have opened her. Nothing is taken from Vee that she does not hand over, gladly.
>
> Warmer and more explicit than the book before it, and more tender the harder it looks at her, *A Proper Serving* sets before a young woman the whole of an appetite that was always hers — the man, the woman beside her, one more door raised and not yet opened — and lets the reader, seated at the table since the first course, hunger right alongside her.
>
> Vee is a willing player in two games. She doesn't know there are three.
>
> *Book Three of* With a Long Spoon. *Literary erotica for readers of Anne Rice's* Beauty *trilogy who want it contemporary and psychologically exact — full heat and full tenderness, a woman coming awake to a man and to the woman beside her, every open door her own to walk through.*'''

