[volumes."1"]
opening_slug = "the-bench"
packet = '''On the cover: the series line **WITH A LONG SPOON · BOOK ONE**, the volume title **A POLITE INVITATION**, and the author **Helen Rivers**. (No tagline on the front — it is the blurb page's closing beat.)

The jacket / blurb page:

> Two people have planned the best year of her life. She doesn't know there's a plan.
>
> Vivienne "Vee" Thorne is twenty-one, a college junior, and quietly starving. The men have been fine. The friendships have been fine. Fine has never once been enough. So when her glamorous new friend, Randi, steers her — lightly, laughing, as if by accident — into the path of a young mathematician named Pace, Vee walks toward him because everything in her has been waiting to.
>
> Pace is nothing like the boys she has known. He sees Vee completely, and under that gaze the shame she has carried since girlhood turns, impossibly, into heat. Courtly, exact, he asks before he takes and leaves her the room to choose, until choosing becomes the most erotic thing she has ever done. What grows between them is the best of her life, and every step of it she gives freely, gladly, with her whole body. Over lunches too intimate to name, she tells Randi everything — and Randi listens, and draws her further open, and welcomes her into a world she'd only ever watched from outside. And Vee never lets herself notice how much she grows to want Randi, too.
>
> What Vee cannot see is that the invitation reached her long before she knew there was one — that it began as a game between the two people now closest to her, a secret choice made about her. What none of them saw coming was how real it would get: as true for the two who started it as for the girl who never knew there was one. Nothing was taken from her that she did not hand over.
>
> Warm, wickedly explicit, and psychologically merciless in its tenderness, *A Polite Invitation* follows a young woman all the way inside an appetite that can only give her the best of herself by taking it — and lets the reader, ahead of her from the start, fall for it exactly as she does.
>
> Every yes was freely given. That was the problem.
>
> *Book One of* With a Long Spoon. *Literary erotica for readers of Anne Rice's* Beauty *trilogy who want it contemporary and psychologically exact — a seduction at full heat and full tenderness, a woman waking to a man and, without quite letting herself know it, wanting the woman beside her, where every open door is a temptation and every step is hers.*'''

[volumes."2"]
opening_slug = "missed-a-spot"
packet = '''On the cover: the series line **WITH A LONG SPOON · BOOK TWO**, the volume title **A WARM RECEPTION**, and the author **Helen Rivers**. (No tagline on the front — it is the blurb page's closing beat.)

The jacket / blurb page:

> Two people set the table for Vivienne "Vee" Thorne's spring. She believes she pulled out the chair herself.
>
> She is twenty-one, a college junior, and she came to them already starving — starving since girlhood, long before either of them — and this spring she learns her appetite runs in more directions than one. Its steady center is Pace, a mathematician, courtly and exact, whose unhurried attention has made a home of the hours behind his door. Under it she crosses thresholds the Vee of last autumn would never have dared, one after another, each on her own nerve, until the daring itself becomes the thing she craves — and she is glad of it, every time she reaches for more.
>
> The long lunches are dinners now, and Randi is across the table for every one. She listens as no one ever has, leaning close, drawing the next thing and the next out of Vee until she is laughing more than she meant to and coloring at what she cannot explain. What surfaced without a name last fall has one this spring, and she can no longer keep from knowing it: she wants the woman across the table as surely as she wants the man behind the door. That reaching is hers, too.
>
> What Vee cannot see is that Randi and Pace chose her together, once, before she was anything to either of them. What none of them counted on was how far it would carry them: she has moved the two who arranged her spring as surely as they have opened her. Nothing is taken from Vee that she does not hand over, gladly.
>
> Warmer and more explicit than the book before it, and more tender the harder it looks at her, *A Warm Reception* sets before a young woman the whole of an appetite that was always hers — the man, the woman beside her, one more door raised and not yet opened — and lets the reader, seated at the table since the first course, hunger right alongside her.
>
> Vee is a willing player in two games. She doesn't know there are three.
>
> *Book Two of* With a Long Spoon. *Literary erotica for readers of Anne Rice's* Beauty *trilogy who want it contemporary and psychologically exact — full heat and full tenderness, a woman coming awake to a man and to the woman beside her, every open door her own to walk through.*'''

